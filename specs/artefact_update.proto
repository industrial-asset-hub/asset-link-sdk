syntax = "proto3";

package siemens.industrialassethub.artefact_update.v1;

import "common_address.proto";

service ArtefactUpdateApi {
  // One control request, followed by progress/results. Artifact bytes use OCI/HTTP.
  rpc PrepareUpdate(ArtefactMetaData) returns (stream UpdateEvent) {}
  rpc ActivateUpdate(ArtefactMetaData) returns (stream UpdateEvent) {}
  rpc CancelUpdate(ArtefactMetaData) returns (stream UpdateEvent) {}
}

message ArtefactMetaData {
  string job_id = 1;
  // Optional Inventory context for traceability.
  string asset_id = 2;
  string view_id = 3;
  // Includes device credentials when required by the connector.
  siemens.common.address.v1.ConnectionParameterSet connection_parameter_set = 4;
  ArtefactType artefact_type = 5;
  OciArtefactReference oci_reference = 6;
}

enum ArtefactType {
  AT_FIRMWARE = 0;
  AT_SOFTWARE = 1;
  AT_BACKUP = 2;
  AT_CONFIGURATION = 3;
  AT_LOGFILE = 4;
}

message OciArtefactReference {
  string registry_url = 1;
  string repository = 2;
  // Immutable manifest digest, including the sha256: prefix.
  string manifest_digest = 3;
}

// All update streams contain progress followed by exactly one final result.
// Progress never confirms completion, even at 100 percent. No events may follow
// the result. A result is authoritative only after normal stream completion.
message UpdateEvent {
  oneof event {
    UpdateProgress progress = 1;
    UpdateResult result = 2;
  }
}

message UpdateProgress {
  // Informational driver-defined step, maximum 64 bytes. Not an outcome.
  string step = 1;
  // Step percentage, 0..100; absent means indeterminate.
  optional uint32 percent = 2;
}

message UpdateResult {
  UpdateOutcome outcome = 1;
  UpdateFailure failure = 2;
}

enum UpdateOutcome {
  UPDATE_OUTCOME_UNSPECIFIED = 0;
  // Success was verified for the requested operation, not the entire workflow.
  UPDATE_OUTCOME_SUCCEEDED = 1;
  // Rejected before the requested change started, or confirmed failed and no
  // longer running. Partial changes may remain; this does not promise rollback.
  UPDATE_OUTCOME_FAILED = 2;
  // Completion and/or whether device work is still running cannot be confirmed.
  UPDATE_OUTCOME_UNKNOWN = 3;
}

message UpdateFailure {
  FailureReason reason = 1;
  // Optional user-safe explanation, maximum 512 bytes. Never include credentials,
  // stack traces or internal response bodies. Detailed diagnostics belong in logs.
  string public_message = 2;
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_INVALID_REQUEST = 1;
  FAILURE_REASON_NOT_SUPPORTED = 2;
  FAILURE_REASON_TARGET_NOT_FOUND = 3;
  FAILURE_REASON_ARTIFACT_UNAVAILABLE = 4;
  FAILURE_REASON_ARTIFACT_INVALID = 5;
  FAILURE_REASON_DEVICE_REJECTED = 6;
  FAILURE_REASON_OPERATION_FAILED = 7;
  FAILURE_REASON_OUTCOME_NOT_CONFIRMED = 8;
}
