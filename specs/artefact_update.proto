syntax = "proto3";

package siemens.industrialassethub.artefact_update.v1;

import "common_address.proto";

service ArtefactUpdateApi {
  // One control request, followed by progress/results. Artifact bytes use OCI/HTTP.
  rpc PrepareUpdate(ArtefactMetaData) returns (stream ArtefactOperationStatus) {}
  rpc ActivateUpdate(ArtefactMetaData) returns (stream ArtefactOperationStatus) {}
  rpc CancelUpdate(ArtefactMetaData) returns (stream ArtefactOperationStatus) {}
}

message ArtefactMetaData {
  string job_id = 1;
  // Optional Inventory context for traceability.
  string asset_id = 2;
  string view_id = 3;
  // Includes device credentials when required by the connector.
  siemens.common.address.v1.ConnectionParameterSet connection_parameter_set = 4;
  ArtefactType artefact_type = 5;
  OciArtefactReference oci_reference = 6;
}

enum ArtefactType {
  AT_FIRMWARE = 0;
  AT_SOFTWARE = 1;
  AT_BACKUP = 2;
  AT_CONFIGURATION = 3;
  AT_LOGFILE = 4;
}

message OciArtefactReference {
  string registry_url = 1;
  string repository = 2;
  // Immutable manifest digest, including the sha256: prefix.
  string manifest_digest = 3;
}

enum ArtefactOperationState {
  AOS_OK = 0;
  AOS_ERROR_FAIL = 1;
  AOS_ERROR_IDENTITY_CHECK_FAIL = 2;
  AOS_ERROR_INCOMPATIBLE = 3;
  AOS_ERROR_NOT_SUPPORTED = 4;
}

enum ArtefactOperationPhase {
  AOP_UNSPECIFIED = 0;
  AOP_PREPARE = 1;
  AOP_DOWNLOAD = 2;
  AOP_INSTALLATION = 3;
  AOP_ACTIVATION = 4;
  AOP_ARCHIVE = 5;
  AOP_UPLOAD = 6;
  AOP_CANCELLATION = 7;
}

message ArtefactOperationStatus {
  ArtefactOperationPhase phase = 1;
  ArtefactOperationState state = 2;
  string message = 3;
  uint32 progress = 4; // in percent (0-100)
}
